<text font-size="20" font-weight="normal" fill="#172b3a"><tspan x="756" y="1173">Adultos: 2 · Menores: 2 · Total: 4</tspan><tspan x="756" y="1216">Menor 1: 1 año · Menor 2: 4 años</tspan><tspan x="756" y="1259">Sillas solicitadas: 2 · Alzadores: 0</tspan><tspan x="756" y="1302">Altura/peso: solo cuando sean necesarios</tspan><tspan x="756" y="1345">para elegir el dispositivo adecuado.</tspan><tspan x="756" y="1388">Revisaremos contigo las sillas necesarias.</tspan></text>
<text font-size="16" font-weight="normal" fill="#5f6e79"><tspan x="756" y="1470.0">La instalación y disponibilidad requieren comprobación.</tspan></text>
