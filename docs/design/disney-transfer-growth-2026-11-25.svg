<text font-size="23" font-weight="bold" fill="#172b3a"><tspan x="48" y="1128.0">1 · Tu viaje</tspan></text>
<text font-size="20" font-weight="normal" fill="#172b3a"><tspan x="48" y="1173">Origen: aeropuerto de Orly</tspan><tspan x="48" y="1216">Destino: hotel de Disneyland Paris</tspan><tspan x="48" y="1259">Fecha: 15/12/2026</tspan><tspan x="48" y="1302">Vuelo: número pendiente</tspan><tspan x="48" y="1345">Aterrizaje: 12:05 · Recogida: por confirmar</tspan><tspan x="48" y="1388">Añadir vuelta: datos independientes de fecha, hora y vuelo.</tspan></text>
<text font-size="16" font-weight="normal" fill="#5f6e79"><tspan x="48" y="1470.0">Si falta algún dato del vuelo, indícalo en la solicitud.</tspan></text>
