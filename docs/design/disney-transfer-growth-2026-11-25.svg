<text font-size="17" font-weight="normal" fill="#172b3a"><tspan x="756" y="1924">Solicitud recibida ≠ reserva confirmada.</tspan><tspan x="756" y="1953">Te comunicaremos el precio final y las condiciones.</tspan></text>
<text font-size="18" font-weight="bold" fill="#172b3a"><tspan x="24" y="2054.0">PARA APROBACIÓN: 70 / 80 / 100 € por vehículo y trayecto. Sin cambios de tarifas en producción.</tspan></text>
<text font-size="17" font-weight="normal" fill="#172b3a"><tspan x="24" y="2094.0">Prioridad: Orly en ambos sentidos. CDG y París sin tarifa aprobada: precio por confirmar.</tspan></text>
