<text font-size="18" font-weight="normal" fill="#172b3a"><tspan x="48" y="1870">Si no hay capacidad comprobada: revisión manual.</tspan><tspan x="48" y="1902">Te confirmaremos el vehículo antes de reservar.</tspan></text>
