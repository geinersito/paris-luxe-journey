<text font-size="23" font-weight="bold" fill="#172b3a"><tspan x="756" y="1568.0">4 · Contacto y resumen</tspan></text>
<text font-size="20" font-weight="normal" fill="#172b3a"><tspan x="756" y="1615">Nombre y apellidos · Teléfono / WhatsApp · Email</tspan><tspan x="756" y="1659">Categoría candidata: VAN · 80 € objetivo</tspan><tspan x="756" y="1703">4 viajeros · 2 sillas · 2 carritos</tspan><tspan x="756" y="1747">4 piezas de equipaje, además de los carritos</tspan><tspan x="756" y="1791">Capacidad y precio final pendientes de validación.</tspan></text>
