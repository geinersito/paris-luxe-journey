name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Test no legacy service_role in Edge Function entrypoints (P0B)
        run: deno test --no-lock --allow-env --allow-read supabase/functions/_shared/adminClient.test.ts supabase/functions/_shared/noLegacyServiceRoleKey.test.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:ci

      - name: Build
        env:
          # Required by scripts/generate-seo.mjs during build
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL || 'https://eliteparistransfer.com' }}
        run: npm run build

      - name: Fetch main branch
        run: git fetch origin main --depth=1

      - name: Lint changed files
        run: npm run lint:changed
